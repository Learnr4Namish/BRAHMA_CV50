name: BRAHMA_CV50 Server Tunnel

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  serve-and-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Standard maximum execution limit for GitHub-hosted runners

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install fastapi uvicorn pillow pydantic python-multipart
          fi

      - name: Prepare Model Weights
        run: |
          mkdir -p weights
          # If weights are missing and an external URL secret is configured, download them
          if [ ! -f "weights/BRAHMA_CV50_PRODUCTION.pt" ]; then
            if [ -n "${{ secrets.MODEL_WEIGHTS_URL }}" ]; then
              echo "Downloading model weights from external source..."
              curl -L "${{ secrets.MODEL_WEIGHTS_URL }}" -o weights/BRAHMA_CV50_PRODUCTION.pt
            else
              echo "Checking for local weights..."
              find . -name "*.pt" -o -name "*.pth"
            fi
          fi

      - name: Install Cloudflare Tunnel Client (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb
          cloudflared --version

      - name: Launch FastAPI Inference Backend
        run: |
          # Start uvicorn in the background on port 8000
          python -m uvicorn app:app --host 0.0.0.0 --port 8000 &
          
          # Wait for the server port to be active
          echo "Waiting for FastAPI server to initialize..."
          until curl -s http://127.0.0.1:8000/docs > /dev/null; do
            sleep 2
          done
          echo "FastAPI server is running successfully on port 8000."

      - name: Start Cloudflare Tunnel Connection
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -n "$TUNNEL_TOKEN" ]; then
            echo "Starting authenticated Cloudflare Tunnel..."
            cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN"
          else
            echo "TUNNEL_TOKEN secret missing! Starting quick ephemeral tunnel..."
            # Fallback to an anonymous trycloudflare.com tunnel if no token is configured
            cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000
          fi
